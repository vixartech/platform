name: platform

services:
  alloy:
    extends:
      file: deployments/base/compose.yaml
      service: base

    image: grafana/alloy:${ALLOY_IMAGE:-v1.11.0}
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ${ALLOY_CONFIG}:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
