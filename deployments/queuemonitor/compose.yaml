# Opt-in, disposable local monitoring laboratory. Never joins the shared platform network.
services:
  redis:
    image: redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    command: [redis-server, --protected-mode, "no", --save, "", --appendonly, "no", --maxmemory, 16mb, --maxmemory-policy, noeviction]
    mem_limit: 64m
    tmpfs: [/data:size=20m]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 1s
      retries: 10
  exporter:
    image: oliver006/redis_exporter:v1.91.1@sha256:c67a432dba6b4ae30f471e3c77cf14a289133bbeeb89abb0bb03e6092efb2836
    command:
      - --redis.addr=redis://redis:6379
      - --script=/config/queue.lua
      - --lua-script-read-only
      - --connection-timeout=2s
      - --set-client-name=false
      - --config-command=-
      - --redis-only-metrics
      - --log-format=json
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${QUEUE_MONITOR_CONFIG_DIR:?Set an absolute product monitoring config directory}/queue.lua
        target: /config/queue.lua
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      redis: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - --config.file=/config/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30m
      - --storage.tsdb.retention.size=32MB
    mem_limit: 256m
    tmpfs: ["/prometheus:size=96m,mode=1777", "/tmp:size=96m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${QUEUE_MONITOR_CONFIG_DIR:?Set product config directory}
        target: /config
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:9090/-/ready]
      interval: 2s
      timeout: 1s
      retries: 15
  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    command: [--config.file=/config/alertmanager.yaml, --storage.path=/alertmanager, --cluster.listen-address=]
    mem_limit: 96m
    tmpfs: ["/alertmanager:size=16m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${QUEUE_MONITOR_CONFIG_DIR:?Set product config directory}/alertmanager.yaml
        target: /config/alertmanager.yaml
        read_only: true
        bind: {create_host_path: false}
  receiver:
    image: node:22.23.2-alpine3.23@sha256:46825fbbd4e996a78b7a2cdc08d75e38a5a505bdab95dcda55605359bf124bc6
    user: node
    command: [node, /receiver.mjs]
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ../../tools/monitor/receiver.mjs:/receiver.mjs:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/events').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 5
networks:
  default:
    internal: true
