name: platform

services:
  mailpit:
    extends:
      file: deployments/base/compose.yaml
      service: base

    image: axllent/mailpit:${MAILPIT_IMAGE:-latest}
    ports:
      - ${MAILPIT_SMTP_PORT:-1025}:1025
      - ${MAILPIT_HTTP_PORT:-8025}:8025

    healthcheck:
      test: wget -qO- http://127.0.0.1:8025/api/v1/messages >/dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
