version: "2"
run:
  go: 1.26.5
  modules-download-mode: vendor
output:
  path-mode: abs
  formats:
    text:
      path: stdout
linters:
  default: all
  disable:
    - noinlineerr
    - varnamelen
    - exhaustruct
    - gochecknoglobals
    - ireturn
    - recvcheck
    - wsl
  settings:
    cyclop:
      max-complexity: 7
    gomoddirectives:
      replace-allow-list:
        - cloud.google.com/go/compute
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 10
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: context-keys-type
          disabled: true
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: github.com/pkg/errors
        hexagonal-domain:
          files:
            - "**/internal/app/*/domain/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid$
        gost-service:
          files:
            - "**/gost/internal/app/gost/service/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/gost/internal/app/gost/domain
            - github.com/vixartech/gost/internal/app/gost/service
            - go.uber.org/mock
        dozor-service:
          files:
            - "**/dozor/internal/app/dozor/service/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/dozor/internal/app/dozor/domain
            - github.com/vixartech/dozor/internal/app/dozor/service
            - go.uber.org/mock
        dozor-ports:
          files:
            - "**/dozor/internal/app/dozor/ports/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/protocol
            - github.com/vixartech/dozor/internal/app/dozor/domain
            - github.com/vixartech/dozor/internal/app/dozor/service
        dozor-adapters:
          files:
            - "**/dozor/internal/app/dozor/adapters/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/dozor/internal/app/dozor/domain
            - github.com/vixartech/dozor/internal/app/dozor/service
        id-service:
          files:
            - "**/id/internal/app/id/service/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/vixartech/gear
            - github.com/vixartech/id/internal/app/id/domain
            - github.com/vixartech/id/internal/app/id/service
            - go.uber.org/mock
        mironenko-service:
          files:
            - "**/mironenko/internal/app/mironenko/service/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/vixartech/gear
            - github.com/vixartech/mironenko/internal/app/mironenko/domain
            - github.com/vixartech/mironenko/internal/app/mironenko/service
            - go.uber.org/mock
        signal-service:
          files:
            - "**/signal/internal/app/signal/service/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/signal/internal/app/signal/domain
            - github.com/vixartech/signal/internal/app/signal/service
            - go.uber.org/mock
        relay-service:
          files:
            - "**/relay/internal/app/relay/service/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/relay/internal/app/relay/domain
            - github.com/vixartech/relay/internal/app/relay/service
            - go.uber.org/mock
        srez-service:
          files:
            - "**/srez/internal/app/srez/service/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/srez/internal/app/srez/domain
            - github.com/vixartech/srez/internal/app/srez/service
            - go.uber.org/mock
        gost-ports:
          files:
            - "**/gost/internal/app/gost/ports/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/gost/internal/app/gost/domain
            - github.com/vixartech/gost/internal/app/gost/service
            - github.com/vixartech/protocol
        id-ports:
          files:
            - "**/id/internal/app/id/ports/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/go-jose/go-jose
            - github.com/google/uuid
            - github.com/ory/fosite
            - github.com/valyala/fasthttp
            - github.com/vixartech/gear
            - github.com/vixartech/id/internal/app/id/domain
            - github.com/vixartech/id/internal/app/id/service
            - github.com/vixartech/protocol
            - golang.org/x/oauth2
            - google.golang.org/protobuf
        mironenko-ports:
          files:
            - "**/mironenko/internal/app/mironenko/ports/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/valyala/fasthttp
            - github.com/vixartech/gear
            - github.com/vixartech/mironenko/internal/app/mironenko/domain
            - github.com/vixartech/mironenko/internal/app/mironenko/service
            - github.com/vixartech/protocol
        signal-ports:
          files:
            - "**/signal/internal/app/signal/ports/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/protocol
            - github.com/vixartech/signal/internal/app/signal/domain
            - github.com/vixartech/signal/internal/app/signal/service
            - google.golang.org/protobuf
        srez-ports:
          files:
            - "**/srez/internal/app/srez/ports/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/srez/internal/app/srez/domain
            - github.com/vixartech/srez/internal/app/srez/service
        gost-adapters:
          files:
            - "**/gost/internal/app/gost/adapters/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/mailru/easyjson
            - github.com/samber/hot
            - github.com/vixartech/gear
            - github.com/vixartech/gost/internal/app/gost/adapters/postgres/gen
            - github.com/vixartech/gost/internal/app/gost/domain
            - github.com/vixartech/gost/internal/app/gost/service
        id-adapters:
          files:
            - "**/id/internal/app/id/adapters/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/go-webauthn/webauthn
            - github.com/google/uuid
            - github.com/jackc/pgx
            - github.com/ory/fosite
            - github.com/vixartech/gear
            - github.com/vixartech/id/internal/app/id/adapters/postgres/gen
            - github.com/vixartech/id/internal/app/id/domain
            - github.com/vixartech/id/internal/app/id/service
            - github.com/vixartech/protocol
            - golang.org/x/crypto
            - google.golang.org/protobuf
        mironenko-adapters:
          files:
            - "**/mironenko/internal/app/mironenko/adapters/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/jackc/pgx
            - github.com/vixartech/gear
            - github.com/vixartech/mironenko/internal/app/mironenko/adapters/postgres/gen
            - github.com/vixartech/mironenko/internal/app/mironenko/domain
            - github.com/vixartech/mironenko/internal/app/mironenko/service
        signal-adapters:
          files:
            - "**/signal/internal/app/signal/adapters/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/signal/internal/app/signal/domain
            - github.com/vixartech/signal/internal/app/signal/service
        relay-adapters:
          files:
            - "**/relay/internal/app/relay/adapters/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - github.com/vixartech/relay/internal/app/relay/adapters/postgres/gen
            - github.com/vixartech/relay/internal/app/relay/domain
            - github.com/vixartech/relay/internal/app/relay/service
        srez-adapters:
          files:
            - "**/srez/internal/app/srez/adapters/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/jackc/pgx
            - github.com/vixartech/gear
            - github.com/vixartech/srez/internal/app/srez/adapters/postgres/gen
            - github.com/vixartech/srez/internal/app/srez/domain
            - github.com/vixartech/srez/internal/app/srez/service
    dupl:
      threshold: 200
    errcheck:
      check-blank: true
    gocyclo:
      min-complexity: 7
    govet:
      disable:
        - fieldalignment
      enable-all: true
    interfacebloat:
      max: 3
    lll:
      line-length: 120
    maintidx:
      under: 45
    nakedret:
      max-func-lines: 0
    tagliatelle:
      case:
        rules:
          json: snake
          mapstructure: snake
          yaml: snake
    wrapcheck:
      ignore-sig-regexps:
        - 'google\.golang\.org/grpc/status\.Error\('
        - 'google\.golang\.org/grpc/internal/status\.Status\)\.Err\('
        - 'trace\.Span\)\.Error\('
        - 'pkg/servers/grpc\.Error\('
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: '^//go:generate '
    paths:
      - _easyjson.go
      - bin$
      - api$
      - build$
      - configs$
      - deployments$
      - docs$
      - tools$
      - vendor$
      - \.git$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - _easyjson.go
      - bin$
      - api$
      - build$
      - configs$
      - deployments$
      - docs$
      - tools$
      - vendor$
      - \.git$
