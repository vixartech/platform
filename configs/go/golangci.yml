version: "2"
run:
  go: 1.26.5
  modules-download-mode: vendor
output:
  path-mode: abs
  formats:
    text:
      path: stdout
linters:
  default: all
  disable:
    - noinlineerr
    - varnamelen
    - exhaustruct
    - gochecknoglobals
    - ireturn
    - recvcheck
    - wsl
  settings:
    cyclop:
      max-complexity: 7
    gomoddirectives:
      replace-allow-list:
        - cloud.google.com/go/compute
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 10
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: context-keys-type
          disabled: true
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: github.com/pkg/errors
        hexagonal-domain:
          files:
            - "**/internal/app/*/domain/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid$
            # Pure HTML5 parsing for source-bound domain evidence; no HTTP clients.
            - golang.org/x/net/html$
            - golang.org/x/net/html/atom$
            # Pure Unicode folding for source text keys; no transport or runtime dependencies.
            - golang.org/x/text/cases$
        spidertower-service:
          files:
            - "**/internal/app/spidertower/service/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - go.uber.org/mock
            - github.com/vixartech/spidertower/internal/app/spidertower/domain
            - github.com/vixartech/spidertower/internal/app/spidertower/service
        spidertower-ports:
          files:
            - "**/internal/app/spidertower/ports/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - go.uber.org/mock
            - github.com/vixartech/spidertower/internal/app/spidertower/domain
            - github.com/vixartech/spidertower/internal/app/spidertower/service
            - github.com/vixartech/protocol
            - google.golang.org/protobuf
            - github.com/valyala/fasthttp
        spidertower-adapters:
          files:
            - "**/internal/app/spidertower/adapters/**/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/vixartech/gear
            - go.uber.org/mock
            - github.com/vixartech/spidertower/internal/app/spidertower/domain
            - github.com/vixartech/spidertower/internal/app/spidertower/service
            - github.com/vixartech/protocol
            - google.golang.org/protobuf
            - github.com/jackc/pgx/v5
            - github.com/vixartech/spidertower/internal/app/spidertower/adapters
        spiderssr-service:
